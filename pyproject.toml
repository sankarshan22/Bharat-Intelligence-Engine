[project]
name = "global-ontology-engine"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    # ── LangChain / LangGraph core ──
    "langchain==1.2.10",
    "langchain-core==1.2.17",
    "langchain-groq==1.1.2",
    "langchain-mcp-adapters==0.2.1",
    "langgraph==1.0.10",
    "langgraph-checkpoint==4.0.1",
    "langgraph-prebuilt==1.0.8",
    "langgraph-sdk==0.3.9",
    "langsmith==0.7.11",

    # ── LLM providers ──
    "groq==0.37.1",

    # ── MCP ──
    "mcp==1.26.0",
    "fastmcp==3.1.0",

    # ── Web application ──
    "Flask==3.1.3",
    "Flask-SocketIO==5.6.1",

    # ── Search ──
    "tavily==1.1.0",
    "duckduckgo-search",

    # ── Vector / embeddings ──
    "faiss-cpu",
    "langchain-huggingface",
    "sentence-transformers",

    # ── HTTP / async ──
    "requests==2.32.5",
    "httpx==0.28.1",
    "httpx-sse==0.4.3",
    "aiohttp==3.13.3",

    # ── Pydantic / validation ──
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",

    # ── Utilities ──
    "python-dotenv==1.2.2",
    "tenacity==9.1.4",
    "orjson==3.11.7",
    "packaging==26.0",
    "PyYAML==6.0.3",
    "python-dateutil==2.9.0.post0",
    "typing_extensions==4.15.0",
]

[build-system]
requires = ["setuptools>=82.0.0"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]